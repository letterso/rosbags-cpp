name: C++ build and installed consumer
on: [push, pull_request]
jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04]
        mcap: ['ON', 'OFF']
        shared: ['ON', 'OFF']
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y libsqlite3-dev libyaml-cpp-dev liblz4-dev libzstd-dev libbz2-dev pkg-config
      - run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DROSBAGS_BUILD_TESTS=ON -DROSBAGS_BUILD_TOOLS=ON -DROSBAGS_ENABLE_MCAP=${{ matrix.mcap }} -DBUILD_SHARED_LIBS=${{ matrix.shared }}
      - run: cmake --build build -j2
      - run: ctest --test-dir build --output-on-failure
  sanitizers:
    runs-on: ubuntu-24.04
    env:
      ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
      UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y libsqlite3-dev libyaml-cpp-dev liblz4-dev libzstd-dev libbz2-dev pkg-config
      - run: cmake -S . -B build-sanitizers -DCMAKE_BUILD_TYPE=Debug -DROSBAGS_ENABLE_MCAP=OFF -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer" -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,undefined"
      - run: cmake --build build-sanitizers -j2
      - run: ctest --test-dir build-sanitizers --output-on-failure
